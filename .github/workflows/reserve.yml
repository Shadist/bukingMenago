name: Booking smoke test

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 8 9 10 *'

  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD)"
        required: true
        default: "2026-10-10"
        type: string
      dry_run:
        description: "Validate only; do NOT submit final acceptance"
        required: true
        default: true
        type: boolean
      confirm_live:
        description: "For dry_run=false type exactly BOOK_NOW"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: booking-bot
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BOOKING_BASE_URL: ${{ secrets.BOOKING_BASE_URL }}
      BOOKING_LOGIN: ${{ secrets.BOOKING_LOGIN }}
      BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
      BOOKING_CLUB_PATH: ${{ secrets.BOOKING_CLUB_PATH }}
      BOOKING_LOGIN_PATH: ${{ secrets.BOOKING_LOGIN_PATH }}
      BOOKING_VERIFY_PATH: ${{ secrets.BOOKING_VERIFY_PATH }}
      BOOKING_OBJECT_ID: ${{ secrets.BOOKING_OBJECT_ID }}
      BOOKING_DISCIPLINE: ${{ secrets.BOOKING_DISCIPLINE }}

      BOOKING_FALLBACK_CLUB_PATH: ${{ secrets.BOOKING_FALLBACK_CLUB_PATH }}
      BOOKING_FALLBACK_OBJECT_ID: ${{ secrets.BOOKING_FALLBACK_OBJECT_ID }}
      BOOKING_FALLBACK_DISCIPLINE: ${{ secrets.BOOKING_FALLBACK_DISCIPLINE }}

      BOOKING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || github.event_name == 'schedule' && 'false' || 'true' }}
      BOOKING_POLL_MODE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      BOOKING_LIVE_AUTHORIZED: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && inputs.confirm_live == 'BOOK_NOW' && 'true' || 'false' }}

      BOOKING_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
      BOOKING_TARGET_OFFSET_DAYS: "2"
      BOOKING_POLL_INTERVAL_SECONDS: "5"

      BOOKING_MIN_START: "18:00"
      BOOKING_PREFERRED_START: "19:30"
      BOOKING_SECONDARY_START: "18:00"
      BOOKING_LATEST_END: "21:30"
      BOOKING_PREFERRED_DURATION_MIN: "90"
      BOOKING_MIN_DURATION_MIN: "60"
      BOOKING_MAX_PRICE: "0.00"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Materialize jittered polling in Java
        if: github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/main/java/io/github/bookingbot/BookingBot.java';
          let s = fs.readFileSync(p, 'utf8');

          if (!s.includes('import java.util.concurrent.ThreadLocalRandom;')) {
            s = s.replace('import java.util.UUID;\n', 'import java.util.UUID;\nimport java.util.concurrent.ThreadLocalRandom;\n');
          }

          s = s.replace(
            '                + " slowIntervalSeconds=180 fastFrom=23:54 fastIntervalSeconds=" + fastPollingIntervalSeconds());',
            '                + " intervals=preFast:120-240,fast:3-7,medium:10-20,late:30-60");'
          );

          const start = s.indexOf('    private int pollingIntervalSeconds() {');
          const end = s.indexOf('    private void sleepPolling(int seconds) {', start);
          if (start < 0 || end < 0) throw new Error('Polling interval methods not found');

          const replacement = `    private int pollingIntervalSeconds() {
              ZonedDateTime nowZoned = ZonedDateTime.now(ZONE);
              LocalTime now = nowZoned.toLocalTime();
              LocalTime fastFrom = LocalTime.of(23, 54);
              LocalTime mediumFrom = LocalTime.of(0, 10);
              LocalTime lateFrom = LocalTime.of(0, 30);
      
              if (now.isBefore(fastFrom) && now.isAfter(LocalTime.of(6, 0))) {
                  long secondsUntilFast = Duration.between(
                          nowZoned,
                          fastFrom.atDate(nowZoned.toLocalDate()).atZone(ZONE)
                  ).getSeconds();
                  return (int) Math.max(1, Math.min(randomSeconds(120, 240), secondsUntilFast));
              }
              if (!now.isBefore(fastFrom) || now.isBefore(mediumFrom)) {
                  return randomSeconds(3, 7);
              }
              if (now.isBefore(lateFrom)) {
                  return randomSeconds(10, 20);
              }
              return randomSeconds(30, 60);
          }
      
          private int randomSeconds(int minInclusive, int maxInclusive) {
              return ThreadLocalRandom.current().nextInt(minInclusive, maxInclusive + 1);
          }
      
`;
          s = s.slice(0, start) + replacement + s.slice(end);
          fs.writeFileSync(p, s);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/io/github/bookingbot/BookingBot.java
          if git diff --cached --quiet; then
            echo "Jitter already materialized."
          else
            git commit -m "Add jittered polling intervals [skip ci]"
            git push
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate secret configuration
        shell: bash
        run: |
          set +x
          for name in \
            BOOKING_BASE_URL BOOKING_LOGIN BOOKING_PASSWORD BOOKING_CLUB_PATH \
            BOOKING_OBJECT_ID BOOKING_DISCIPLINE
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Actions secret: $name" >&2
              exit 2
            fi
          done

      - name: Enforce live safety gate
        if: env.BOOKING_DRY_RUN != 'true'
        shell: bash
        run: |
          set +x
          if [[ "${BOOKING_LIVE_AUTHORIZED:-false}" != "true" ]]; then
            echo "Live mode blocked: explicit authorization is missing." >&2
            exit 3
          fi
          echo "Live booking authorized. Final acceptance is still subject to server validation and price=0.00."

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Run booking client
        run: java -jar target/booking-bot-1.0.0.jar
