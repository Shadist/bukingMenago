name: Booking smoke test

on:
  push:
    branches:
      - main

  schedule:
    - cron: '54 23 * * *'
      timezone: "Europe/Warsaw"
    - cron: '30 20 8 10 *'
      timezone: "Europe/Warsaw"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD)"
        required: true
        default: "2026-10-10"
        type: string
      dry_run:
        description: "Validate only; do NOT submit final acceptance"
        required: true
        default: true
        type: boolean
      confirm_live:
        description: "For dry_run=false type exactly BOOK_NOW"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: booking-bot
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BOOKING_BASE_URL: ${{ secrets.BOOKING_BASE_URL }}
      BOOKING_LOGIN: ${{ secrets.BOOKING_LOGIN }}
      BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
      BOOKING_CLUB_PATH: ${{ secrets.BOOKING_CLUB_PATH }}
      BOOKING_LOGIN_PATH: ${{ secrets.BOOKING_LOGIN_PATH }}
      BOOKING_VERIFY_PATH: ${{ secrets.BOOKING_VERIFY_PATH }}
      BOOKING_OBJECT_ID: ${{ secrets.BOOKING_OBJECT_ID }}
      BOOKING_DISCIPLINE: ${{ secrets.BOOKING_DISCIPLINE }}

      BOOKING_FALLBACK_CLUB_PATH: ${{ secrets.BOOKING_FALLBACK_CLUB_PATH }}
      BOOKING_FALLBACK_OBJECT_ID: ${{ secrets.BOOKING_FALLBACK_OBJECT_ID }}
      BOOKING_FALLBACK_DISCIPLINE: ${{ secrets.BOOKING_FALLBACK_DISCIPLINE }}

      BOOKING_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '2026-10-10' }}
      BOOKING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || github.event_name == 'schedule' && github.event.schedule == '30 20 8 10 *' && 'false' || 'true' }}
      BOOKING_LIVE_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live || '' }}
      BOOKING_SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
      BOOKING_TARGET_OFFSET_DAYS: ${{ github.event_name == 'schedule' && github.event.schedule == '30 20 8 10 *' && '2' || '4' }}

      BOOKING_MIN_START: "18:00"
      BOOKING_PREFERRED_START: "19:30"
      BOOKING_SECONDARY_START: "18:00"
      BOOKING_LATEST_END: "21:30"
      BOOKING_PREFERRED_DURATION_MIN: "90"
      BOOKING_MIN_DURATION_MIN: "60"
      BOOKING_MAX_PRICE: "0.00"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate secret configuration
        shell: bash
        run: |
          set +x
          for name in \
            BOOKING_BASE_URL BOOKING_LOGIN BOOKING_PASSWORD BOOKING_CLUB_PATH \
            BOOKING_OBJECT_ID BOOKING_DISCIPLINE
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Actions secret: $name" >&2
              exit 2
            fi
          done

            - name: Enforce live safety gate
        if: env.BOOKING_DRY_RUN != 'true'
        shell: bash
        run: |
          set +x

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${BOOKING_LIVE_CONFIRM:-}" != "BOOK_NOW" ]]; then
              echo "Live mode blocked: confirm_live must be exactly BOOK_NOW." >&2
              exit 3
            fi

          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            if [[ "${BOOKING_SCHEDULE_EXPR:-}" != "30 20 8 10 *" ]]; then
              echo "Live mode blocked for this schedule." >&2
              exit 3
            fi

            if [[ "$(TZ=Europe/Warsaw date +%F)" != "2026-10-08" ]]; then
              echo "One-off live test expired." >&2
              exit 3
            fi

            echo "Scheduled live test accepted."

          else
            echo "Live mode blocked for event: ${GITHUB_EVENT_NAME}" >&2
            exit 3
          fi

          echo "Final acceptance allowed only after validation and price=0.00."
      - name: Apply verified HTTP flow patches
        run: python3 .github/scripts/patch_all.py

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Run booking client
        run: java -jar target/booking-bot-1.0.0.jar
